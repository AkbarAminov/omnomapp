<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OmNom</title>
    <!-- Инлайн, без сети: до того как придёт src/index.css, страница не должна мигнуть белым. -->
    <style>html,body{background:#FFF1DC}</style>
    <!-- API и сторож картинок — один и тот же хост Supabase; второй preconnect не нужен. -->
    <link rel="preconnect" href="https://pgmrurujvvpxpembsqir.supabase.co" crossorigin />
    <!-- defer: раньше этот синхронный тег стоял первым в <head> и блокировал разбор страницы —
         шрифты, CSS и наш модуль не могли начать грузиться, пока telegram.org не ответит.
         defer сохраняет порядок (выполнится раньше нашего type="module" в конце body — defer- и
         module-скрипты выполняются вместе по порядку в документе), но больше не блокирует парсинг. -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
